<footer class="foot">
  <div class="wrap">
    <div class="foot__row">
      <span>{{ site.title | escape }} — {{ site.author | escape }}</span>
      <ul class="foot__links">
        <li><a href="https://github.com/{{ site.github_username }}">github</a></li>
        <li><a href="https://linkedin.com/in/{{ site.linkedin_username }}">linkedin</a></li>
        <li><a href="mailto:{{ site.email }}">email</a></li>
        <li><a href="{{ "/feed.xml" | relative_url }}">rss</a></li>
      </ul>
    </div>
    <div class="foot__row" style="margin-top:.4rem">
      <span>built with jekyll · no trackers, no comments, no cookies</span>
      <span>&copy; {{ site.time | date: "%Y" }}</span>
    </div>
  </div>
</footer>
