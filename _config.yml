# Site settings
title: Signal & Sawdust
email: jasonrhaas@gmail.com
description: >
  Jason Haas on software, signals, and things cut to length. Python, AWS, data
  plumbing, remote work, and the occasional woodworking project.
tagline: Software, signals, and things cut to length.
author: Jason Haas
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jasonrhaas.github.io"
twitter_username: jasonrhaas
github_username:  jasonrhaas
linkedin_username: jasonrhaas

# Nav order. Without this Jekyll lists pages alphabetically.
header_pages:
  - archive.md
  - about.md

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-gist

sass:
  style: compressed

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - JasonHaas_Resume.md
  - vendor/
