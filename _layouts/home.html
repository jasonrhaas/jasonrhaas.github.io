---
layout: default
---
{{ content }}

<ul class="list">
  {%- for post in site.posts -%}
    {% include post-row.html post=post latest=forloop.first %}
  {%- endfor -%}
</ul>

<p class="list__foot">
  <span>{{ site.posts | size }} posts · {{ site.posts.last.date | date: "%Y" }} → {{ site.posts.first.date | date: "%Y" }}</span>
  <span><a href="{{ "/archive/" | relative_url }}">full archive</a> · <a href="{{ "/feed.xml" | relative_url }}">rss</a></span>
</p>
