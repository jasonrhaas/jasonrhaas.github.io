name: Build

on:
  pull_request:
  push:
    branches: [master]
  # Lets the build be re-run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Lets a newer push cancel an in-flight run for the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # html-proofer parses with nokogiri, which needs a UTF-8 locale to read
      # posts containing em-dashes and smart quotes.
      LANG: C.UTF-8
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          # Read from .ruby-version so CI and local stay in step.
          ruby-version: .ruby-version
          bundler-cache: true

      # --strict_front_matter turns an unparseable YAML header into a build
      # failure instead of a silently skipped post.
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter

      # Internal links and images only. External links are checked on a
      # schedule instead (see links.yml) so a dead third-party URL can never
      # block a PR.
      # The separately hosted sigmund-history project is checked as an external URL.
      - name: Check internal links and images
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --no-enforce-https \
            --swap-urls 'https\://signalandsawdust\.com(?!/sigmund-history(/|$)):'

      # Package directly because upload-pages-artifact@v4 embeds a Node 20 action.
      - name: Package Pages site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: tar --dereference --hard-dereference --directory _site --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
