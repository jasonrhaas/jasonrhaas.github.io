name: Link check

on:
  schedule:
    # Mondays at 14:00 UTC. Weekly, not per-PR: external links break for
    # reasons that have nothing to do with the change under review.
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      # 403 and 429 are near-always the remote site refusing a CI runner
      # rather than a dead page, so they are not treated as failures.
      # Twitter/X and LinkedIn block unauthenticated fetches outright.
      - name: Check all links
        run: |
          bundle exec htmlproofer ./_site \
            --no-enforce-https \
            --swap-urls "https\://signalandsawdust.com:" \
            --ignore-status-codes "403,429" \
            --ignore-urls "/^https?:\/\/(www\.)?(twitter|x)\.com/,/^https?:\/\/(www\.)?linkedin\.com/" \
            --typhoeus '{"timeout":30,"connecttimeout":15,"followlocation":true}' \
            --hydra '{"max_concurrency":10}'
