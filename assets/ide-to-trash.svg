<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">An IDE window being thrown into a trash can</title>
<desc id="d">A tilted code-editor window with a file sidebar and syntax-colored lines arcs toward an open trash can whose lid has been set aside, while a terminal prompt blinks below.</desc>
<style>
  svg { --bg:#fdfdf8; --ink:#121311; --dim:#6f7268; --hair:#d5d6cc; --fill:#f2f2ea; --acc:#0f7d8c; --acc-2:#b34a08; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0b0d0c; --ink:#e6e5dc; --dim:#8b8f85; --hair:#282b27; --fill:#141716; --acc:#4fd3e0; --acc-2:#f0913f; }
  }
  .paper { fill: var(--bg); }
  .panel { fill: var(--fill); }
  .solid { fill: var(--bg); stroke: none; }
  .ln    { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: square; stroke-linejoin: round; }
  .mouth { fill: var(--fill); }
  .hair  { fill: none; stroke: var(--hair); stroke-width: 2; }
  .dimln { fill: none; stroke: var(--dim); stroke-width: 2.5; stroke-linecap: round; }
  .code  { fill: var(--dim); }
  .accf  { fill: var(--acc); }
  .acc2f { fill: var(--acc-2); }
  .dimf  { fill: var(--dim); }
  .ghost { fill: none; stroke: var(--dim); stroke-width: 2; opacity: .25; }
  .txt   { fill: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; }
  .caret { fill: var(--acc); }
</style>

<rect class="paper" width="1200" height="620"/>

<!-- ghost trail: where the window used to sit -->
<g class="ghost">
  <rect x="76" y="192" width="420" height="280" rx="6" transform="rotate(-6 286 332)"/>
  <rect x="84" y="172" width="420" height="280" rx="6" transform="rotate(-11 294 312)"/>
</g>

<!-- the IDE window, tipped over and falling -->
<g transform="rotate(-16 300 290) translate(90 150)">
  <rect class="paper ln" x="0" y="0" width="420" height="280" rx="6"/>
  <!-- title bar -->
  <path class="panel" d="M6 0h408a6 6 0 0 1 6 6v28H0V6a6 6 0 0 1 6-6z"/>
  <path class="ln" d="M0 34h420"/>
  <circle class="ln" cx="22" cy="17" r="6"/>
  <circle class="ln" cx="44" cy="17" r="6"/>
  <circle class="ln" cx="66" cy="17" r="6"/>
  <text class="txt" x="210" y="23" text-anchor="middle" font-size="15">main.go</text>
  <!-- sidebar -->
  <path class="panel" d="M0 34h112v246H6a6 6 0 0 1-6-6z"/>
  <path class="ln" d="M112 34v246"/>
  <g class="dimln">
    <path d="M20 60h60M32 84h52M32 106h44M20 130h64M32 154h40M32 176h56M20 200h48"/>
  </g>
  <!-- editor: lines of code -->
  <g class="code">
    <rect x="140" y="56" width="150" height="9" rx="4"/>
    <rect x="140" y="80" width="228" height="9" rx="4"/>
    <rect class="accf" x="160" y="104" width="104" height="9" rx="4"/>
    <rect x="160" y="128" width="186" height="9" rx="4"/>
    <rect class="acc2f" x="160" y="152" width="72" height="9" rx="4"/>
    <rect x="140" y="176" width="130" height="9" rx="4"/>
    <rect x="140" y="200" width="204" height="9" rx="4"/>
    <rect x="140" y="224" width="96" height="9" rx="4"/>
  </g>
</g>

<!-- flight path, ending in the can's mouth -->
<path class="dimln" stroke-dasharray="2 12" d="M556 168C672 92 800 118 874 242"/>
<path class="dimf" d="M874 250 L866 214 L850 234 Z"/>

<!-- loose bits shaken free -->
<rect class="ghost" x="620" y="196" width="26" height="26" rx="3" transform="rotate(24 633 209)"/>
<rect class="ghost" x="742" y="160" width="18" height="18" rx="3" transform="rotate(-18 751 169)"/>

<!-- the trash can, open -->
<g>
  <!-- lid, set aside on the ground -->
  <g transform="rotate(-11 1072 514)">
    <ellipse class="paper ln" cx="1072" cy="514" rx="86" ry="20"/>
    <path class="ln" d="M1050 507a22 14 0 0 1 44 0"/>
  </g>
  <!-- body -->
  <path class="solid" d="M802 298l34 222a14 14 0 0 0 14 12h100a14 14 0 0 0 14-12l34-222z"/>
  <g class="hair">
    <path d="M848 336l10 176M900 336v180M952 336l-10 176"/>
  </g>
  <path class="ln" d="M802 298l34 222a14 14 0 0 0 14 12h100a14 14 0 0 0 14-12l34-222"/>
  <!-- the open mouth -->
  <ellipse class="mouth ln" cx="900" cy="298" rx="98" ry="23"/>
  <ellipse class="hair" cx="900" cy="301" rx="84" ry="16"/>
  <!-- ground -->
  <path class="hair" d="M784 558h384"/>
</g>

<!-- long live the terminal -->
<g transform="translate(96 546)">
  <text class="txt" x="0" y="0">$</text>
  <rect class="caret" x="24" y="-14" width="13" height="19"/>
</g>
</svg>
