<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shop">
<meta name="theme-color" content="#141210">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="shop-icon-180.png">
<title>Shop Mode</title>
<style>
/* VOICE a native phone app you use with sawdust on your hands
   IDEA a tape measure in an iOS shell: system type, grouped lists, sheets,
        and the lengths read off a yellow blade
   PICTURE the blade under the nav bar - one tick per step, done steps
           blacked in, a red hook on the step you are on
   COLOUR iOS system greys, blade yellow #ffd60a, green for done, red for flags
   TYPE the phone's own system font; lengths in its rounded cut
   LAYOUT phone: nav bar, blade, a paged card per step with Done in thumb
          reach, tab bar. laptop: the pager beside the full list */
:root{color-scheme:light dark;--fs:1;
--bg:light-dark(#ffffff,#000000);--grp:light-dark(#f2f2f7,#000000);--cell:light-dark(#ffffff,#1c1c1e);
--fill:light-dark(rgba(118,118,128,.12),rgba(118,118,128,.24));
--ink:light-dark(#000000,#ffffff);--ink2:light-dark(rgba(60,60,67,.62),rgba(235,235,245,.62));
--sep:light-dark(rgba(60,60,67,.24),rgba(84,84,88,.6));
--bar:light-dark(rgba(249,249,249,.92),rgba(22,22,22,.92));
--tint:light-dark(#000000,#ffd60a);--blade:#ffd60a;
--go:light-dark(#248a3d,#30d158);--red:light-dark(#d70015,#ff453a);
--sys:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
--rnd:ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
:root[data-fs="2"]{--fs:1.2}
:root[data-fs="3"]{--fs:1.42}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.install{display:flex;align-items:center;gap:10px;margin:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));padding:10px 8px 10px 14px;background:var(--fill);border-radius:12px;font-size:15px}
.install span{flex:1}
.install button{border:0;background:none;font-weight:600;min-height:36px;padding:0 8px;cursor:pointer}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 var(--sys);overflow:hidden}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
svg{flex:none}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
.nav{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;background:#141210;color:#fff;padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));-webkit-user-select:none;user-select:none}
.nav .l{font-size:15px;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;white-space:nowrap}
.nav .l b{color:#ffd60a;font-weight:700}
.nav h1{margin:0;font-size:17px;font-weight:600;white-space:nowrap;text-align:center}
.nav .r{justify-self:end;display:flex;align-items:center}
.nav .ib{color:#fff}
.ib{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);position:relative;border-radius:22px}
.ib:active{opacity:.45}
.dot{position:absolute;top:9px;right:8px;width:8px;height:8px;border-radius:4px;background:var(--red)}
.blade{grid-column:1/-1;background:var(--blade);display:flex;height:14px;cursor:pointer;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.tk{flex:1 1 0;position:relative;background:linear-gradient(#1a1406,#1a1406) left bottom/1px 45% no-repeat}
.tk.major{background:linear-gradient(#1a1406,#1a1406) left bottom/2px 100% no-repeat}
.tk.done{background-color:#2a2310}
.tk.cur::after{content:"";position:absolute;left:-2px;top:0;bottom:0;width:4px;background:#ff3b30}
.main{grid-row:3;grid-column:1;min-height:0;position:relative}
.view{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.view.off{display:none}
.pad{padding:8px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.lt{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.005em;margin:10px 0 2px}
.lh{font-size:13px;color:var(--ink2);margin:22px 16px 7px;text-transform:uppercase;letter-spacing:.02em}
.grpbg{background:var(--grp)}
/* the step pager - the phone's own scroll does the swiping */
#v-now{display:flex;flex-direction:column;overflow:hidden}
#v-now.off{display:none}
.pager{flex:1 1 auto;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pg{padding:6px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px))}
.sub{color:var(--ink2);font-size:17px;margin:0 0 16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.okb{display:inline-flex;align-items:center;gap:4px;color:var(--go);font-weight:600}
.rule{background:var(--fill);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:16px}
.rule b{color:var(--red)}
.hold{background:color-mix(in srgb,var(--red) 12%,var(--bg));border-radius:12px;padding:12px 14px;margin:6px 0 10px;font-size:16px}
.hold b{color:var(--red)}
.act{font-size:calc(var(--fs) * clamp(25px,7vw,31px));line-height:1.3;font-weight:500;letter-spacing:-.01em}
.act.isdone{color:var(--ink2)}
.act strong{font-weight:700}
.act ul.labels{list-style:none;margin:14px 0 0;padding:0;background:var(--grp);border-radius:12px;font-size:.72em;line-height:1.35}
.act ul.labels li{padding:12px 14px}
.act ul.labels li+li{box-shadow:inset 0 .5px 0 var(--sep)}
.row .txt ul.labels{margin:6px 0 0;padding-left:1.1em}
.n{font:800 1.16em/1 var(--rnd);background:var(--blade);color:#000;padding:.06em .22em;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:0}
.pid{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:.18em;cursor:pointer}
.ins{list-style:none;margin:0;padding:0;background:var(--cell);border-radius:12px;overflow:hidden}
.ins>li+li{box-shadow:inset 0 .5px 0 var(--sep)}
.pg .ins{background:var(--grp)}
.pg .lh{margin-left:4px}
.prow{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;min-height:52px;padding:8px 12px 8px 16px;background:none;border:0;text-align:left;cursor:pointer}
.prow:active,.upnext:active,.srow:active{background:var(--fill)}
.prow b{font:700 calc(var(--fs) * 19px) var(--rnd)}
.prow span{color:var(--ink2);font-size:15px;line-height:1.25}
.prow i{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.chev{color:var(--ink2);opacity:.6}
.upnext{display:block;width:100%;text-align:left;background:var(--grp);border:0;border-radius:12px;padding:12px 16px;font-size:16px;color:var(--ink2);cursor:pointer}
.hint{color:var(--ink2);font-size:15px;text-align:center;margin:18px 0 0}
.actions{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg);box-shadow:0 -.5px 0 var(--sep)}
.round{width:60px;height:60px;border-radius:30px;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--red);transition:transform .08s}
.cap{height:60px;border-radius:30px;border:0;background:var(--go);color:#fff;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s}
.cap.un{background:var(--fill);color:var(--go)}
.cap:active,.round:active{transform:scale(.96)}
.arrow{display:none}
@media(hover:hover) and (pointer:fine){.arrow{display:grid;position:absolute;top:42%;width:40px;height:40px;border-radius:20px;border:0;background:var(--fill);place-items:center;cursor:pointer;z-index:2}.arrow.p{left:6px}.arrow.x{right:6px}.pg{padding-left:56px;padding-right:56px}}
/* lists */
.sech{display:flex;align-items:baseline;gap:8px;margin:24px 16px 7px}
.sech b{font-size:20px;font-weight:700}
.sech span{color:var(--ink2);font-size:15px}
.sech em{margin-left:auto;font-style:normal;color:var(--ink2);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sech.full em{color:var(--go);font-weight:600}
.rw{position:relative;overflow:hidden}
.rw:has(.row[style*="translateX"]){background:var(--go)}
.rw.isd:has(.row[style*="translateX"]){background:var(--ink2)}
.rw::before{content:"Done";position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#fff;font-weight:700;font-size:17px}
.rw.isd::before{content:"Undo"}
.row{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:start;background:var(--cell);position:relative;touch-action:pan-y}
.row.snap{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.row.cur{background:color-mix(in srgb,var(--blade) 22%,var(--cell))}
.ck{width:52px;min-height:52px;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0}
.ck span{width:26px;height:26px;border-radius:13px;border:2px solid var(--sep);display:grid;place-items:center;color:transparent;transition:background .12s}
.ck[aria-checked=true] span{background:var(--go);border-color:var(--go);color:#fff}
.row .txt{background:none;border:0;text-align:left;padding:14px 16px 14px 0;font-size:calc(var(--fs) * 17px);line-height:1.38;cursor:pointer}
.row .txt small{color:var(--ink2);font-variant-numeric:tabular-nums;margin-right:4px;font-size:.85em}
.row .txt .n{font-size:1.06em}
.row.isdone .txt{color:var(--ink2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;min-height:36px;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;padding:0 10px}
.seg button[aria-pressed=true]{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.scopes{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.scopes::-webkit-scrollbar{display:none}
.scopes button{flex:none;border:0;background:var(--fill);border-radius:16px;padding:7px 14px;font-size:15px;cursor:pointer}
.scopes button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:40px;margin-top:6px;color:var(--ink2)}
.search input{flex:1;border:0;background:none;font:17px var(--sys);color:var(--ink);outline:0;height:100%}
.empty{color:var(--ink2);padding:18px 16px;text-align:center}
textarea{display:block;width:100%;min-height:130px;font:17px/1.4 var(--sys);padding:12px 16px;border:0;background:var(--cell);color:var(--ink);resize:none;outline:0}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 16px;background:none;border:0;text-align:left;color:var(--ink);text-decoration:none;font-size:17px;cursor:pointer}
.srow>span:first-child{flex:1;line-height:1.3}
.srow .v{color:var(--ink2);font-size:15px;text-align:right}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw:checked{background:#34c759}
.sw:checked::after{transform:translateX(20px)}
.save{display:block;width:100%;margin-top:16px}
.notes .meta{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px}
.notes li{padding:12px 16px}
.notes .txt{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.notes .reply{margin:8px 0 0;padding:8px 12px;background:var(--fill);border-radius:10px;font-size:15px;white-space:pre-wrap}
.pill{font-weight:600}
.pill.open{color:var(--red)}
.pill.done{color:var(--go)}
/* tab bar */
.tabs{grid-row:4;grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;min-height:52px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink2);cursor:pointer;position:relative}
.tabs button[aria-current=page]{color:var(--tint)}
.tabs button[aria-current=page] svg{stroke-width:2.3}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;line-height:18px;font-weight:600}
/* sheets */
dialog{border:0;padding:0;width:100%;max-width:640px;max-height:92svh;margin:auto auto 0;border-radius:14px 14px 0 0;background:var(--grp);color:var(--ink);overflow:hidden}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:rgba(0,0,0,.4)}
@keyframes up{from{transform:translateY(100%)}}
.shw{max-height:92svh;overflow-y:auto;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.shw.snap{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.grab{position:sticky;top:0;z-index:2;height:22px;display:grid;place-items:center;background:var(--grp);margin:0 -16px;touch-action:none;cursor:grab}
.grab::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--sep)}
.shh{display:flex;align-items:flex-start;gap:12px;touch-action:none}
.shh h3{font-size:28px;font-weight:700;margin:0;font-family:var(--rnd)}
.shh p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.shh .ib{margin-left:auto;background:var(--fill);width:32px;height:32px;color:var(--ink2)}
.big{font:800 calc(var(--fs) * 30px)/1.1 var(--rnd);margin:14px 0 0}
.big small{display:block;font:500 13px var(--sys);color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
.kv li{display:grid;grid-template-columns:minmax(5.5em,auto) minmax(0,1fr);gap:12px;padding:11px 16px;font-size:16px}
.kv dt,.kv .k{color:var(--ink2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:rgba(30,30,30,.94);color:#fff;padding:8px 8px 8px 18px;border-radius:24px;display:flex;gap:10px;align-items:center;font-size:15px;font-weight:500;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--blade);font-weight:700;min-height:36px;padding:0 10px;cursor:pointer}
.side{display:none}
@media(min-width:980px){
.app{grid-template-columns:minmax(0,1fr) minmax(0,420px)}
.side{display:block;grid-row:3;grid-column:2;overflow-y:auto;background:var(--grp);box-shadow:inset .5px 0 0 var(--sep)}
.main{grid-column:1}
.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs [data-v=steps]{display:none}
}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}.row.snap,.shw.snap{transition:none}}
</style>
</head><body>
<div class="app" id="app">
<header class="nav">
  <span class="l" id="count"></span>
  <h1 id="ttl">Step</h1>
  <span class="r"><button type="button" class="ib" id="b-more" aria-label="Settings"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg><span class="dot" id="errdot" hidden></span></button></span>
</header>
<div class="blade" id="blade" role="img" aria-label="Progress"></div>
<main class="main">
  <section class="view" id="v-now" aria-label="Current step">
    <div class="pager" id="pager" aria-roledescription="carousel"></div>
    <button type="button" class="arrow p" id="ar-p" aria-label="Previous step"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
    <button type="button" class="arrow x" id="ar-n" aria-label="Next step"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <div class="install" id="install" hidden><span>Install: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span><button type="button" id="install-x">Got it</button></div>
    <div class="actions">
      <button type="button" class="round" id="b-flag" aria-label="Flag a problem with this step"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h12l-2.5 4.5L17 13H5"/></svg></button>
      <button type="button" class="cap" id="b-done">Done</button>
    </div>
  </section>
  <section class="view grpbg off" id="v-steps" aria-label="All steps"><div class="pad" id="steps-a"></div></section>
  <section class="view grpbg off" id="v-parts" aria-label="Parts">
    <div class="pad">
      <h2 class="lt">Parts</h2>
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="D16, sink, R2" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Search parts"></label>
      <div class="scopes" id="kinds"></div>
      <ul class="ins" id="plist" style="margin-top:12px"></ul>
    </div>
  </section>
  <section class="view grpbg off" id="v-notes" aria-label="Notes for Claude">
    <form class="pad" id="note-form">
      <h2 class="lt">Notes</h2>
      <p class="lh">For Claude, read next session</p>
      <div class="ins"><textarea id="note-text" placeholder="A measurement, a defect, a step that is wrong" aria-label="Note"></textarea>
        <label class="srow" id="about-wrap" style="box-shadow:inset 0 .5px 0 var(--sep)"><span id="note-about-t"></span><input type="checkbox" class="sw" id="note-about" checked></label></div>
      <button class="cap save" type="submit" id="note-save">Save note</button>
      <div id="send-bar" hidden><button class="cap save un" type="button" id="b-send">Send notes to Claude</button>
        <button type="button" class="srow" id="b-clear" style="justify-content:center;color:var(--red);margin-top:6px">Clear sent notes</button></div>
      <p class="empty" id="note-off" hidden>Notes save only when this page is open inside Claude. Here they would be lost, so tell Claude in the chat instead.</p>
      <p class="lh">Your notes</p>
      <ul class="ins notes" id="notes"></ul>
    </form>
  </section>
</main>
<aside class="side" id="side" aria-label="All steps"><div class="pad" id="steps-b"></div></aside>
<nav class="tabs" id="tabs" aria-label="Views">

<script>
{
const $ = id => document.getElementById(id);
const D = JSON.parse($('shop-data').textContent);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';
const X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const steps = [];
D.groups.forEach((g, gi) => {
  g.first = steps.length;
  g.acts.forEach((a, i) => steps.push(Object.assign({}, a, {g: gi, i, n: steps.length + 1})));
});
const N = steps.length;
const byKey = {}; steps.forEach((s, i) => byKey[s.k] = i);
const part = {}; D.parts.forEach(p => part[p.id] = p);
const mentions = {};
steps.forEach((s, i) => s.ids.forEach(id => (mentions[id] = mentions[id] || []).push(i)));
D.groups.forEach(g => g.parts.forEach(id => { if (g.acts.length) (mentions[id] = mentions[id] || []).push(g.first); }));

/* ---- device-local conveniences */
const LS = 'shopmode.v1';
const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { return {}; } };
const lsSet = o => { try { localStorage.setItem(LS, JSON.stringify(o)); } catch (e) {} };
const lget = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lput = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const local = lsGet();
let done = Object.assign({}, local.done || {});
let cur = byKey[local.cur] ?? firstOpen(0);
let view = 'now', kind = 'All', db = null, notes = [], dbState = 'wait';
let fs = +lget('shopmode.fs', 1) || 1, hintSeen = lget('shopmode.swiped', '') === '1';
document.documentElement.setAttribute('data-fs', fs);
const APP = !!D.app;
const NK = 'shopmode.notes';
let localNotes = [];
try { localNotes = JSON.parse(localStorage.getItem(NK) || '[]') || []; } catch (e) {}
const saveNotes = () => lput(NK, JSON.stringify(localNotes));
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
if (APP && !standalone && /iPhone|iPad|iPod/.test(navigator.userAgent) && !lget('shopmode.installed', '')) $('install').hidden = false;
$('install-x').onclick = () => { $('install').hidden = true; lput('shopmode.installed', '1'); };

function firstOpen(from) {
  for (let i = from; i < N; i++) if (!done[steps[i].k]) return i;
  for (let i = 0; i < from; i++) if (!done[steps[i].k]) return i;
  return Math.max(0, Math.min(from, N - 1));
}
const nDone = () => steps.reduce((a, s) => a + (done[s.k] ? 1 : 0), 0);

/* ---- haptics: vibrate where it exists; on iPhone, Safari ticks when a
   switch control flips, so flip a hidden one */
function haptic() {
  try {
    if (navigator.vibrate) { navigator.vibrate(10); return; }
    const l = document.createElement('label'); l.ariaHidden = 'true'; l.style.display = 'none';
    const c = document.createElement('input'); c.type = 'checkbox'; c.setAttribute('switch', '');
    l.appendChild(c); document.head.appendChild(l); l.click(); l.remove();
  } catch (e) {}
}

/* ---- saving: the artifact's store when there is one, this device otherwise */
let writing = false, dirty = false;
function saveLocal() { lsSet({done, cur: steps[cur] && steps[cur].k}); }
function save() {
  saveLocal();
  if (!db) return;
  dirty = true;
  if (!writing) flush();
}
async function flush() {
  writing = true;
  while (dirty) {
    dirty = false; setSync('saving');
    try {
      await db.doc('shop/progress').set({done: Object.assign({}, done), at: new Date().toISOString()});
      setSync('ok');
    } catch (e) {
      if (e && e.code === 'unavailable') { dirty = true; await new Promise(r => setTimeout(r, 900 + Math.random() * 900)); continue; }
      setSync('err', e && e.code); break;
    }
  }
  writing = false;
}
const SYNC = {wait: 'Connecting', device: 'Saved on this phone', saving: 'Saving', ok: 'Saved to this artifact', local: 'This device only', slow: 'Can\'t reach the store yet', err: 'Not saved'};
let syncCode = '';
function setSync(s, code) { dbState = s; syncCode = code || ''; $('errdot').hidden = !(s === 'err' || s === 'slow'); const v = $('set-sync'); if (v) v.textContent = syncText(); }
const syncText = () => SYNC[dbState] + (syncCode ? ' (' + syncCode + ')' : '');

/* ---- the blade and the nav */
function drawTop() {
  $('blade').innerHTML = steps.map((s, i) => '<span class="tk' + (s.i === 0 ? ' major' : '') + (done[s.k] ? ' done' : '') + (i === cur ? ' cur' : '') + '"></span>').join('');
  const nd = nDone();
  $('blade').setAttribute('aria-label', nd + ' of ' + N + ' steps done');
  $('count').innerHTML = '<b>' + nd + '</b>/' + N + ' done';
  $('ttl').textContent = view === 'now' ? 'Step ' + (cur + 1) + ' of ' + N : {steps: 'All steps', parts: 'Parts', notes: 'Notes'}[view];
}
$('blade').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect(), cs = getComputedStyle(e.currentTarget);
  const pl = parseFloat(cs.paddingLeft), w = r.width - pl - parseFloat(cs.paddingRight);
  go(Math.max(0, Math.min(N - 1, Math.floor((e.clientX - r.left - pl) / w * N))));
});

/* ---- the pager: one page per step, swiped by the phone's own scroll */
const pager = $('pager');
function ruleFor(gi) { const p = D.groups[gi - 1]; return p && !p.acts.length && p.rule ? p : null; }
const holdsHTML = D.holds.map(h => '<div class="hold"><b>Do not cut: ' + esc(h.what) + '</b><br>' + esc(h.why) + (h.until ? ' Until ' + esc(h.until) + '.' : '') + '</div>').join('');
function prow(id) {
  const p = part[id];
  return '<li><button type="button" class="prow" data-p="' + esc(id) + '"><b>' + esc(id) + '</b><span>' + esc(p ? p.name || p.kind : '') + '</span>' + CHEV + '</button></li>';
}
function pageHTML(i) {
  const s = steps[i], g = D.groups[s.g], d = !!done[s.k], r = ruleFor(s.g);
  const ids = s.ids.concat(s.i === 0 ? g.parts.filter(x => s.ids.indexOf(x) < 0) : []);
  const nx = steps[i + 1];
  return holdsHTML +
    '<h2 class="lt">' + g.name + '</h2>' +
    '<p class="sub"><span>' + (g.tool ? g.tool + ' &middot; ' : '') + (s.i + 1) + ' of ' + g.acts.length + '</span>' + (d ? '<span class="okb">' + CHECK + 'Done</span>' : '') + '</p>' +
    (r && s.i === 0 ? '<div class="rule"><b>' + r.name + '.</b> ' + r.rule + '</div>' : '') +
    '<div class="act' + (d ? ' isdone' : '') + '">' + s.h + '</div>' +
    (ids.length ? '<p class="lh">In this step</p><ul class="ins">' + ids.map(prow).join('') + '</ul>' : '') +
    (nx ? '<p class="lh">Up next' + (nx.g !== s.g ? ' &middot; ' + D.groups[nx.g].name : '') + '</p><button type="button" class="upnext" data-go="' + (i + 1) + '">' + esc(nx.t) + '</button>' : '') +
    (i === 0 && !hintSeen ? '<p class="hint">Swipe left for the next step</p>' : '');
}
pager.innerHTML = steps.map((s, i) => '<article class="page" data-i="' + i + '" role="group" aria-roledescription="slide" aria-label="Step ' + s.n + '"><div class="pg">' + pageHTML(i) + '</div></article>').join('');
const pageCache = steps.map((s, i) => pageHTML(i));
function refreshPage(i) {
  const h = pageHTML(i);
  if (pageCache[i] !== h) { pageCache[i] = h; pager.children[i].firstElementChild.innerHTML = h; }
}
function refreshPages() { for (let i = 0; i < N; i++) refreshPage(i); }
let settleT = 0;
function settle() {
  const w = pager.clientWidth; if (!w) return;
  const i = Math.max(0, Math.min(N - 1, Math.round(pager.scrollLeft / w)));
  if (i !== cur) {
    cur = i; saveLocal(); drawTop(); drawBar(); markRow(); drawAbout();
    if (!hintSeen) { hintSeen = true; lput('shopmode.swiped', '1'); refreshPage(0); }
  }
}
pager.addEventListener('scroll', () => { clearTimeout(settleT); settleT = setTimeout(settle, 80); }, {passive: true});
pager.addEventListener('scrollend', settle);
function place(smooth) {
  const w = pager.clientWidth; if (!w) return;
  pager.scrollTo({left: cur * w, behavior: smooth && !reduced ? 'smooth' : 'auto'});
}
new ResizeObserver(() => place(false)).observe(pager);
function go(i, smooth) {
  if (i < 0 || i >= N) return;
  const near = Math.abs(i - cur) <= 2;
  cur = i; saveLocal(); drawTop(); drawBar(); markRow(); drawAbout();
  if (view !== 'now') show('now');
  const pg = pager.children[i]; if (pg) pg.scrollTop = 0;
  place(smooth !== false && near);
}
$('ar-p').onclick = () => go(cur - 1);
$('ar-n').onclick = () => go(cur + 1);

function drawBar() {
  const d = !!done[steps[cur].k], b = $('b-done');
  b.className = 'cap' + (d ? ' un' : '');
  b.innerHTML = d ? 'Undo done' : CHECK.replace('16', '22').replace('16', '22') + 'Done';
}
function setDone(i, on) {
  const k = steps[i].k;
  if (on) done[k] = new Date().toISOString(); else delete done[k];
  save(); refreshPage(i); drawTop(); drawBar(); drawSteps();
}
$('b-done').onclick = () => {
  haptic();
  const i = cur;
  if (done[steps[i].k]) { setDone(i, false); return; }
  setDone(i, true);
  const nx = firstOpen(i + 1);
  toast('Step ' + steps[i].n + ' done', () => { setDone(i, false); go(i); });
  if (nx !== i) setTimeout(() => go(nx), 180);
};
$('b-flag').onclick = () => { show('notes'); $('note-about').checked = true; setTimeout(() => $('note-text').focus(), 50); };
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea') || $('sheet').open || view !== 'now') return;
  if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1);
});

/* ---- a horizontal drag that follows the finger (list rows, swipe right
   to tick); vertical moves stay with the page */
let dragged = false;
document.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
function dragX(el, o) {
  let x0 = null, y0 = 0, dx = 0, t0 = 0, on = false, pid = null, past = false;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; t0 = e.timeStamp; on = false; pid = e.pointerId; past = false;
  });
  el.addEventListener('pointermove', e => {
    if (x0 === null || e.pointerId !== pid) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!on) {
      if (Math.abs(mx) > 10 && Math.abs(mx) > 1.4 * Math.abs(my)) { on = true; el.classList.remove('snap'); try { el.setPointerCapture(pid); } catch (er) {} }
      else if (Math.abs(my) > 10) { x0 = null; return; }
      else return;
    }
    dx = o.ok(mx) ? mx : mx / 5;
    el.style.transform = 'translateX(' + dx + 'px)';
    const p = o.ok(mx) && Math.abs(mx) > o.at;
    if (p && !past) haptic();
    past = p;
  });
  const end = e => {
    if (x0 === null || e.pointerId !== pid) return;
    x0 = null;
    if (!on) return;
    dragged = true; setTimeout(() => { dragged = false; }, 60);
    const fast = Math.abs(dx) > 50 && Math.abs(dx) / Math.max(1, e.timeStamp - t0) > 0.6;
    el.classList.add('snap');
    if (e.type !== 'pointercancel' && o.ok(dx) && (Math.abs(dx) > o.at || fast)) o.commit(el);
    else el.style.transform = '';
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ---- all steps: grouped lists with Reminders-style circles */
function stepsHTML() {
  const top = '<h2 class="lt">All steps</h2>' + holdsHTML;
  return top + D.groups.map((g, gi) => {
    if (!g.acts.length) return g.rule ? '<div class="rule" style="margin-top:18px"><b>' + g.name + '.</b> ' + g.rule + '</div>' : '';
    const nd = g.acts.filter(a => done[a.k]).length;
    return '<div class="sech' + (nd === g.acts.length ? ' full' : '') + '"><b>' + g.name + '</b>' + (g.tool ? '<span>' + g.tool + '</span>' : '') + '<em>' + nd + ' of ' + g.acts.length + '</em></div>' +
      '<ul class="ins">' + g.acts.map((a, i) => {
        const si = g.first + i, dn = !!done[a.k];
        return '<li class="rw' + (dn ? ' isd' : '') + '"><div class="row' + (dn ? ' isdone' : '') + (si === cur ? ' cur' : '') + '" data-i="' + si + '">' +
          '<button type="button" class="ck" role="checkbox" aria-checked="' + dn + '" data-t="' + si + '" aria-label="Step ' + (si + 1) + ' done"><span>' + CHECK + '</span></button>' +
          '<button type="button" class="txt" data-go="' + si + '"><small>' + (si + 1) + '</small> ' + a.h.replace(/<button[^>]*>|<\/button>/g, '') + '</button></div></li>';
      }).join('') + '</ul>';
  }).join('');
}
function drawSteps() {
  const h = stepsHTML();
  ['steps-a', 'steps-b'].forEach(id => {
    const box = $(id); box.innerHTML = h;
    box.querySelectorAll('.row').forEach(r => dragX(r, {
      ok: dx => dx > 0, at: 90,
      commit: el => { el.style.transform = 'translateX(' + el.offsetWidth + 'px)'; const i = +el.dataset.i; setTimeout(() => setDone(i, !done[steps[i].k]), 200); }
    }));
  });
}
function markRow() {
  document.querySelectorAll('.row.cur').forEach(r => r.classList.remove('cur'));
  document.querySelectorAll('.row[data-i="' + cur + '"]').forEach(r => r.classList.add('cur'));
}

/* ---- parts */
const KINDS = ['All'].concat([...new Set(D.parts.map(p => p.kind))]);
$('kinds').innerHTML = KINDS.map(k => '<button type="button" data-k="' + esc(k) + '" aria-pressed="' + (k === kind) + '">' + esc(k) + '</button>').join('');
$('kinds').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  kind = b.dataset.k;
  $('kinds').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === kind));
  drawParts();
});
$('q').addEventListener('input', () => drawParts());
function drawParts() {
  const q = $('q').value.trim().toLowerCase();
  const hit = D.parts.filter(p => (kind === 'All' || p.kind === kind) && (!q || (p.id + ' ' + p.name).toLowerCase().includes(q)));
  hit.sort((a, b) => (b.id.toLowerCase().startsWith(q)) - (a.id.toLowerCase().startsWith(q)));
  $('plist').innerHTML = hit.length ? hit.map(p => '<li><button type="button" class="prow" data-p="' + esc(p.id) + '"><b>' + esc(p.id) + '</b><span>' + esc(p.name || p.kind) + '</span><i>' + esc(p.size) + '</i></button></li>').join('')
    : '<li class="empty">Nothing matches that.</li>';
}

/* ---- sheets: slide up, drag down to dismiss */
const sheet = $('sheet'), shw = $('shw');
function openSheet(html) {
  $('sh').innerHTML = html;
  shw.scrollTop = 0; shw.style.transform = '';
  if (!sheet.open) { try { sheet.showModal(); } catch (e) { sheet.setAttribute('open', ''); } }
}
function closeSheet() {
  if (!sheet.open) return;
  if (reduced) { sheet.close(); return; }
  shw.classList.add('snap'); shw.style.transform = 'translateY(100%)';
  setTimeout(() => { sheet.close(); shw.classList.remove('snap'); shw.style.transform = ''; }, 230);
}
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
sheet.addEventListener('cancel', e => { e.preventDefault(); closeSheet(); });
(() => {
  let y0 = null, dy = 0, t0 = 0, pid = null, on = false;
  shw.addEventListener('pointerdown', e => {
    const handle = e.target.closest('#grab,.shh');
    if (!handle && shw.scrollTop > 0) return;
    y0 = e.clientY; dy = 0; t0 = e.timeStamp; pid = e.pointerId; on = false;
  });
  shw.addEventListener('pointermove', e => {
    if (y0 === null || e.pointerId !== pid) return;
    const m = e.clientY - y0;
    if (!on) { if (m > 8) { on = true; shw.classList.remove('snap'); try { shw.setPointerCapture(pid); } catch (er) {} } else if (m < -8) { y0 = null; return; } else return; }
    dy = Math.max(0, m); shw.style.transform = 'translateY(' + dy + 'px)';
  });
  const end = e => {
    if (y0 === null || e.pointerId !== pid) return;
    y0 = null; if (!on) return;
    dragged = true; setTimeout(() => { dragged = false; }, 60);
    if (dy > 120 || (dy > 40 && dy / Math.max(1, e.timeStamp - t0) > 0.6)) closeSheet();
    else { shw.classList.add('snap'); shw.style.transform = ''; }
  };
  shw.addEventListener('pointerup', end); shw.addEventListener('pointercancel', end);
})();
function head(title, sub) {
  return '<div class="shh"><div><h3 id="sh-t">' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</div><button type="button" class="ib" data-close aria-label="Close">' + X + '</button></div>';
}
function openPart(id) {
  const p = part[id]; if (!p) return;
  const ms = [...new Set(mentions[id] || [])];
  const fin = ['Door', 'Drawer face', 'Door pair'].indexOf(p.kind) >= 0;
  openSheet(head(esc(p.id), esc(p.name ? p.name + ' · ' + p.kind : p.kind)) +
    '<div class="big"><small>' + (fin ? 'Finished' : 'Size') + '</small>' + esc(p.size) + '</div>' +
    '<p class="lh">Details</p><ul class="ins kv">' + p.rows.map(r => '<li><span class="k">' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></li>').join('') + '</ul>' +
    (ms.length ? '<p class="lh">In the steps</p><ul class="ins">' + ms.map(i => '<li><button type="button" class="srow" data-go="' + i + '"><span><b>' + steps[i].n + '</b>&ensp;' + esc(steps[i].t) + '</span>' + (done[steps[i].k] ? '<span class="okb">' + CHECK + '</span>' : '') + CHEV + '</button></li>').join('') + '</ul>' : ''));
}
let lock = null;
function openSettings() {
  const book = /^https:\/\//.test(D.book || '') ? D.book : '';
  openSheet(head('Settings', '') +
    '<p class="lh">Text size</p><div class="seg" role="group" aria-label="Text size">' +
    [1, 2, 3].map(n => '<button type="button" data-fs="' + n + '" aria-pressed="' + (fs === n) + '" style="font-size:' + (13 + n * 3) + 'px">' + ['Large', 'Larger', 'Largest'][n - 1] + '</button>').join('') + '</div>' +
    '<p class="lh">Shop</p><ul class="ins">' +
    ('wakeLock' in navigator ? '<li><label class="srow"><span>Keep screen on</span><input type="checkbox" class="sw" id="sw-wake"' + (lock ? ' checked' : '') + '></label></li>' : '') +
    '<li><div class="srow"><span>Ticks and notes</span><span class="v" id="set-sync">' + esc(syncText()) + '</span></div></li>' +
    (book ? '<li><a class="srow" href="' + esc(book) + '"><span>Full Shop Book</span>' + CHEV + '</a></li>' : '') + '</ul>');
  const sw = $('sw-wake');
  if (sw) sw.onchange = async () => {
    haptic();
    if (!sw.checked) { if (lock) try { await lock.release(); } catch (e) {} lock = null; return; }
    try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { if (document.visibilityState === 'visible') lock = null; }); }
    catch (e) { sw.checked = false; sw.disabled = true; toast('This viewer will not keep the screen on', null); }
  };
}
document.addEventListener('visibilitychange', async () => {
  if (lock && document.visibilityState === 'visible') try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
});
$('b-more').onclick = openSettings;
$('sh').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  const f = e.target.closest('[data-fs]');
  if (f) {
    fs = +f.dataset.fs; lput('shopmode.fs', fs); haptic();
    document.documentElement.setAttribute('data-fs', fs);
    $('sh').querySelectorAll('[data-fs]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.fs === fs));
  }
});

/* ---- one click handler for part ids, step links and ticks */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t) { haptic(); const i = +t.dataset.t; setDone(i, !done[steps[i].k]); return; }
  const p = e.target.closest('[data-p]');
  if (p) { e.preventDefault(); openPart(p.dataset.p); return; }
  const g = e.target.closest('[data-go]');
  if (g) { if (sheet.open) closeSheet(); go(+g.dataset.go); }
});

/* ---- notes */
function drawAbout() {
  const s = steps[cur];
  $('note-about-t').textContent = s ? 'About step ' + s.n + ': ' + s.t.slice(0, 70) + (s.t.length > 70 ? '...' : '') : '';
  $('about-wrap').hidden = !s;
}
const noteList = () => APP ? localNotes.slice().reverse() : notes.map(n => n.data() || {});
function drawNotes() {
  drawAbout();
  const off = !APP && dbState === 'local';
  $('note-off').hidden = !off;
  $('note-save').disabled = off || (!APP && !db);
  const list = noteList();
  $('notes').innerHTML = list.length ? list.map(d => {
    const st = APP ? (d.sent ? '<span class="pill done">Sent</span>' : '<span class="pill open">Not sent yet</span>')
      : (d.status === 'done' ? '<span class="pill done">Claude: handled</span>' : '<span class="pill open">Waiting for Claude</span>');
    const when = d.at ? new Date(d.at).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '';
    return '<li><div class="meta">' + st + '<span>' + esc(when) + '</span>' + (d.stepNo ? '<span>step ' + esc(d.stepNo) + '</span>' : '') + '</div>' +
      '<p class="txt">' + esc(d.text || '') + '</p>' + (d.reply ? '<p class="reply">' + esc(d.reply) + '</p>' : '') + '</li>';
  }).join('') : '<li class="empty">Nothing flagged yet.</li>';
  const open = APP ? localNotes.filter(n => !n.sent).length : list.filter(d => d.status !== 'done').length;
  $('send-bar').hidden = !APP || !localNotes.length;
  $('b-send').disabled = !localNotes.some(n => !n.sent);
  const nb = document.querySelector('.tabs [data-v=notes]');
  const old = nb.querySelector('.badge'); if (old) old.remove();
  if (open) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = open; nb.appendChild(b); }
}
$('note-form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('note-text').value.trim();
  if (!text || (!APP && !db)) return;
  const s = steps[cur], about = $('note-about').checked && s;
  const rec = {text, at: new Date().toISOString(), status: 'open',
    step: about ? s.k : null, stepNo: about ? s.n : null, stepText: about ? s.t.slice(0, 200) : null,
    station: about ? D.groups[s.g].name.replace(/<[^>]+>/g, '') : null};
  if (APP) {
    localNotes.push(rec); saveNotes();
    $('note-text').value = ''; $('note-text').blur(); haptic();
    toast('Saved. Send it to Claude when you are ready', null);
    drawNotes(); return;
  }
  $('note-save').disabled = true;
  try {
    await db.collection('notes').add(rec);
    $('note-text').value = ''; $('note-text').blur(); haptic();
    toast('Saved for Claude', null);
  } catch (err) {
    toast(err && err.code === 'quota_exceeded' ? 'Note store is full' : 'Not saved - try again', null);
  }
  $('note-save').disabled = false;
});

/* ---- the app has no store Claude can read: notes leave by the share sheet */
$('b-send').onclick = async () => {
  const un = localNotes.filter(n => !n.sent);
  if (!un.length) return;
  const when = a => new Date(a).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
  const text = 'Shop notes from Shop Mode:\n' + un.map(n => '- ' +
    (n.stepNo ? '[step ' + n.stepNo + (n.station ? ', ' + n.station : '') + ': "' + (n.stepText || '').slice(0, 80) + '"] ' : '') +
    n.text + ' (' + when(n.at) + ')').join('\n');
  let ok = false;
  if (navigator.share) {
    try { await navigator.share({title: 'Shop notes', text}); ok = true; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (!ok) {
    try { await navigator.clipboard.writeText(text); ok = true; toast('Copied. Paste it into Claude', null); }
    catch (e) { toast('Could not share or copy', null); }
  }
  if (ok) { un.forEach(n => { n.sent = true; }); saveNotes(); drawNotes(); }
};
$('b-clear').onclick = () => { localNotes = localNotes.filter(n => !n.sent); saveNotes(); drawNotes(); };

/* ---- views */
function show(v) {
  if (v === 'steps' && matchMedia('(min-width:980px)').matches) v = 'now';
  view = v;
  ['now', 'steps', 'parts', 'notes'].forEach(x => $('v-' + x).classList.toggle('off', x !== v));
  document.querySelectorAll('.tabs [data-v]').forEach(b => b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'));
  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  drawTop();
  if (v === 'now') requestAnimationFrame(() => place(false));
  if (v === 'steps') { const r = $('steps-a').querySelector('.row.cur'); if (r) r.scrollIntoView({block: 'center'}); }
  if (v === 'notes') drawNotes();
}
document.querySelectorAll('.tabs [data-v]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.v === view && view !== 'now') { $('v-' + view).scrollTo({top: 0, behavior: reduced ? 'auto' : 'smooth'}); return; }
  haptic(); show(b.dataset.v);
}));
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['now', 'steps', 'parts', 'notes'].includes(h) && h !== view) show(h); });
matchMedia('(min-width:980px)').addEventListener('change', () => show(view));

/* ---- toast */
let tt = 0;
function toast(msg, undo) {
  $('toast-t').textContent = msg;
  $('toast-b').hidden = !undo;
  $('toast-b').onclick = () => { $('toast').hidden = true; if (undo) undo(); };
  $('toast').hidden = false;
  clearTimeout(tt); tt = setTimeout(() => { $('toast').hidden = true; }, 4000);
}

/* ---- boot */
function renderAll() { refreshPages(); drawTop(); drawBar(); drawSteps(); drawNotes(); }
renderAll();
const h0 = location.hash.slice(1);
show(['now', 'steps', 'parts', 'notes'].includes(h0) ? h0 : 'now');
drawParts();
const use = window.claude && typeof window.claude.use === 'function' ? n => window.claude.use(n) : () => Promise.resolve(null);
(APP ? Promise.resolve('app') : use('db')).then(d => {
  if (d === 'app') { setSync('device'); drawNotes(); return; }
  if (!d) { setSync('local'); drawNotes(); return; }
  db = d;
  let first = true;
  const slow = setTimeout(() => { if (first) setSync('slow'); }, 10000);
  db.doc('shop/progress').onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(slow); if (dbState === 'slow' || dbState === 'wait') setSync('ok'); }
    if (snap.exists) {
      if (!writing && !dirty) { done = Object.assign({}, (snap.data() || {}).done || {}); saveLocal(); }
    } else if (!snap.metadata.fromCache && Object.keys(done).length) {
      save();                       // first visit with the store: carry this device's ticks up
    }
    if (first) { first = false; const c = firstOpen(byKey[local.cur] ?? 0); if (c !== cur) { renderAll(); go(c, false); return; } }
    renderAll();
  }, err => { clearTimeout(slow); setSync('err', err && err.code); });
  db.collection('notes').orderBy('at', 'desc').limit(200).onSnapshot(snap => { notes = snap.docs; drawNotes(); }, () => {});
  drawNotes();
}).catch(() => { setSync('local'); drawNotes(); });
}
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
